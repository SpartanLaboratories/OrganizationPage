ktor:
  application:
    modules:
      - com.spartanlaboratories.server.ApplicationKt.module
  deployment:
    port: "$PORT:8080"
    host: "$HOST:0.0.0.0"

site:
  # Extra origins allowed to call the API from a browser, comma separated
  # (e.g. the static site's domain when it is hosted separately from the API).
  corsOrigins: "$CORS_ORIGINS:"
