# Build once, deploy to staging, then wait for approval before production.
#
#   build ──> staging (automatic) ──> production (main only, after a reviewer approves)
#
# Production receives the same artifact that was viewed on staging; nothing is rebuilt.
# The approval comes from the "production" environment's required reviewers, and the
# production job refuses to deploy if that protection is missing.
#
# The file keeps its original name so the manual "Run workflow" button, which GitHub
# only offers for workflows present on the default branch, stays available.
name: OrganizationPage Deploy
run-name: OrganizationPage deploy of ${{ github.ref_name }}

on:
  push:
    branches:
      - main
  # Run manually from the Actions tab to stage any branch. Only main can reach production.
  workflow_dispatch:
    inputs:
      clean_staging:
        description: Delete existing files in the staging directory before uploading
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

# Folders are paths as the FTP login sees them (it starts in the hosting account's home
# folder). Repository variables of the same name override these defaults.
env:
  PRODUCTION_REMOTE_DIR: ${{ vars.SPACESHIP_REMOTE_DIR || '/spartanlaboratories.org' }}
  PRODUCTION_URL: ${{ vars.SPACESHIP_PRODUCTION_URL || 'https://spartanlaboratories.org' }}
  # Staging is a subfolder of the production site (staging.spartanlaboratories.org
  # redirects to it), so production deploys must never clean their target folder.
  STAGING_REMOTE_DIR: ${{ vars.SPACESHIP_STAGING_REMOTE_DIR || '/spartanlaboratories.org/staging' }}
  STAGING_URL: ${{ vars.SPACESHIP_STAGING_URL || 'https://spartanlaboratories.org/staging/' }}

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Test and build site
        run: ./gradlew check :web:jsBrowserDistribution

      - name: Record build info
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg run "$GITHUB_RUN_ID" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{commit: $commit, run: $run, builtAt: $builtAt}' \
            > web/build/dist/js/productionExecutable/build-info.json

      - name: Upload site artifact
        uses: actions/upload-artifact@v5
        with:
          name: site
          path: web/build/dist/js/productionExecutable/
          if-no-files-found: error
          retention-days: 90

  staging:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: staging
      url: ${{ env.STAGING_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      - name: Check staging target
        id: target
        shell: bash
        run: |
          set -euo pipefail

          normalize() {
            local dir="/${1#/}"
            [[ "$dir" == */ ]] || dir="$dir/"
            printf '%s' "$dir"
          }

          staging="$(normalize "$STAGING_REMOTE_DIR")"
          production="$(normalize "$PRODUCTION_REMOTE_DIR")"

          if [[ "$staging" == "/" || "$staging" == "$production" ]]; then
            echo "::error::SPACESHIP_STAGING_REMOTE_DIR ($staging) must be a separate folder from production ($production)." >&2
            exit 1
          fi

          echo "remote_dir=$staging" >> "$GITHUB_OUTPUT"

      - name: Checkout deploy action
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions

      - name: Download site artifact
        uses: actions/download-artifact@v5
        with:
          name: site
          path: .deploy

      - name: Mark as staging
        shell: bash
        run: |
          set -euo pipefail
          # Keep staging out of search results and easy to tell apart in a browser tab.
          # This only changes the staging upload; production gets the artifact as built.
          grep -q '<head>' .deploy/index.html
          grep -q '<title>' .deploy/index.html
          sed -i \
            -e 's|<head>|<head>\n    <meta name="robots" content="noindex, nofollow" />|' \
            -e 's|<title>|<title>[Staging] |' \
            .deploy/index.html

      - name: Deploy to staging
        uses: ./.github/actions/spaceship-deploy
        with:
          local-dir: .deploy/
          remote-dir: ${{ steps.target.outputs.remote_dir }}
          server: ${{ secrets.SPACESHIP_FTP_SERVER }}
          username: ${{ secrets.SPACESHIP_FTP_USERNAME }}
          password: ${{ secrets.SPACESHIP_FTP_PASSWORD }}
          protocol: ${{ vars.SPACESHIP_FTP_PROTOCOL }}
          port: ${{ vars.SPACESHIP_FTP_PORT }}
          timeout: ${{ vars.SPACESHIP_FTP_TIMEOUT }}
          clean-remote: ${{ inputs.clean_staging || 'false' }}

      - name: Summary
        shell: bash
        run: |
          {
            echo "## Staged ${GITHUB_SHA::7} from \`${GITHUB_REF_NAME}\`"
            echo
            echo "View it at **${STAGING_URL}**"
            echo
            if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
              echo "Production is waiting for approval: use **Review deployments** at the top of this run."
            else
              echo "Built from a branch, so production is skipped. Merge to \`main\` to ship it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  production:
    needs: staging
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    # A reviewer must approve this environment before the job starts.
    environment:
      name: production
      url: ${{ env.PRODUCTION_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read

    steps:
      - name: Check production target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          dir="/${PRODUCTION_REMOTE_DIR#/}"
          [[ "$dir" == */ ]] || dir="$dir/"
          # The FTP login starts in the home folder, so "/" would spill the site into it.
          if [[ "$dir" == "/" ]]; then
            echo "::error::The production folder can't be the FTP root; set SPACESHIP_REMOTE_DIR to the site's folder." >&2
            exit 1
          fi
          echo "remote_dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Require an approval gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Fail closed: without required reviewers this job would have started with
          # nobody looking at staging, so refuse to touch production.
          if ! reviewers="$(gh api "repos/$GITHUB_REPOSITORY/environments/production" \
              --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length')"; then
            echo "::error::Could not read the production environment's protection rules, so production was not deployed." >&2
            exit 1
          fi
          if [[ "$reviewers" == "0" ]]; then
            echo "::error::The production environment has no required reviewers. Add them (Settings > Environments > production), then re-run this job." >&2
            exit 1
          fi

      - name: Checkout deploy action
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions

      - name: Download site artifact
        uses: actions/download-artifact@v5
        with:
          name: site
          path: .deploy

      - name: Deploy to production
        uses: ./.github/actions/spaceship-deploy
        with:
          local-dir: .deploy/
          remote-dir: ${{ steps.target.outputs.remote_dir }}
          server: ${{ secrets.SPACESHIP_FTP_SERVER }}
          username: ${{ secrets.SPACESHIP_FTP_USERNAME }}
          password: ${{ secrets.SPACESHIP_FTP_PASSWORD }}
          protocol: ${{ vars.SPACESHIP_FTP_PROTOCOL }}
          port: ${{ vars.SPACESHIP_FTP_PORT }}
          timeout: ${{ vars.SPACESHIP_FTP_TIMEOUT }}
          # Never clean: the production folder also holds the staging site.
          clean-remote: "false"

      - name: Summary
        shell: bash
        run: |
          {
            echo "## Deployed ${GITHUB_SHA::7} to production"
            echo
            echo "Live at **${PRODUCTION_URL}**"
          } >> "$GITHUB_STEP_SUMMARY"
