# Build once, deploy to staging, then wait for approval before production.
#
#   build ──> staging (automatic) ──> production (main only, after a reviewer approves)
#
# Production receives the same artifact that was viewed on staging; nothing is rebuilt.
# The approval comes from the "production" environment's required reviewers, and the
# production job refuses to deploy if that protection is missing.
#
# The file keeps its original name so the manual "Run workflow" button, which GitHub
# only offers for workflows present on the default branch, stays available.
name: Deploy

on:
  push:
    branches:
      - main
  # Run manually from the Actions tab to stage any branch. Only main can reach production.
  workflow_dispatch:
    inputs:
      clean_remote:
        description: Delete existing files in each target directory before uploading to it
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Test and build site
        run: ./gradlew check :web:jsBrowserDistribution

      - name: Record build info
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg run "$GITHUB_RUN_ID" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{commit: $commit, run: $run, builtAt: $builtAt}' \
            > web/build/dist/js/productionExecutable/build-info.json

      - name: Upload site artifact
        uses: actions/upload-artifact@v5
        with:
          name: site
          path: web/build/dist/js/productionExecutable/
          if-no-files-found: error
          retention-days: 90

  staging:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: staging
      url: ${{ vars.SPACESHIP_STAGING_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      - name: Check staging target
        id: target
        shell: bash
        env:
          STAGING_DIR: ${{ vars.SPACESHIP_STAGING_REMOTE_DIR }}
          PRODUCTION_DIR: ${{ vars.SPACESHIP_REMOTE_DIR }}
        run: |
          set -euo pipefail

          normalize() {
            local dir="/${1#/}"
            [[ "$dir" == */ ]] || dir="$dir/"
            printf '%s' "$dir"
          }

          if [[ -z "${STAGING_DIR:-}" ]]; then
            echo "::error::Set the SPACESHIP_STAGING_REMOTE_DIR repository variable to the staging site's folder on the FTP server (see README)." >&2
            exit 1
          fi

          staging="$(normalize "$STAGING_DIR")"
          production="$(normalize "${PRODUCTION_DIR:-/}")"

          if [[ "$staging" == "/" || "$staging" == "$production" ]]; then
            echo "::error::SPACESHIP_STAGING_REMOTE_DIR ($staging) must be a separate folder from production ($production)." >&2
            exit 1
          fi

          echo "remote_dir=$staging" >> "$GITHUB_OUTPUT"

      - name: Checkout deploy action
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions

      - name: Download site artifact
        uses: actions/download-artifact@v5
        with:
          name: site
          path: .deploy

      - name: Mark as staging
        shell: bash
        run: |
          set -euo pipefail
          # Keep staging out of search engines and easy to tell apart in a browser tab.
          # This only changes the staging upload; production gets the artifact as built.
          printf 'User-agent: *\nDisallow: /\n' > .deploy/robots.txt
          grep -q '<head>' .deploy/index.html
          grep -q '<title>' .deploy/index.html
          sed -i \
            -e 's|<head>|<head>\n    <meta name="robots" content="noindex, nofollow" />|' \
            -e 's|<title>|<title>[Staging] |' \
            .deploy/index.html

      - name: Deploy to staging
        uses: ./.github/actions/spaceship-deploy
        with:
          local-dir: .deploy/
          remote-dir: ${{ steps.target.outputs.remote_dir }}
          server: ${{ secrets.SPACESHIP_FTP_SERVER }}
          username: ${{ secrets.SPACESHIP_FTP_USERNAME }}
          password: ${{ secrets.SPACESHIP_FTP_PASSWORD }}
          protocol: ${{ vars.SPACESHIP_FTP_PROTOCOL }}
          port: ${{ vars.SPACESHIP_FTP_PORT }}
          timeout: ${{ vars.SPACESHIP_FTP_TIMEOUT }}
          clean-remote: ${{ inputs.clean_remote || 'false' }}

      - name: Summary
        shell: bash
        env:
          STAGING_URL: ${{ vars.SPACESHIP_STAGING_URL }}
          REMOTE_DIR: ${{ steps.target.outputs.remote_dir }}
        run: |
          {
            echo "## Staged ${GITHUB_SHA::7} from \`${GITHUB_REF_NAME}\`"
            echo
            if [[ -n "${STAGING_URL:-}" ]]; then
              echo "View it at **${STAGING_URL}**"
            else
              echo "Uploaded to \`${REMOTE_DIR}\`. Set the SPACESHIP_STAGING_URL variable to get a link here."
            fi
            echo
            if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
              echo "Production is waiting for approval: use **Review deployments** at the top of this run."
            else
              echo "Built from a branch, so production is skipped. Merge to \`main\` to ship it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  production:
    needs: staging
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    # A reviewer must approve this environment before the job starts.
    environment:
      name: production
      url: ${{ vars.SPACESHIP_PRODUCTION_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read

    steps:
      - name: Require an approval gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Fail closed: without required reviewers this job would have started with
          # nobody looking at staging, so refuse to touch production.
          if ! reviewers="$(gh api "repos/$GITHUB_REPOSITORY/environments/production" \
              --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length')"; then
            echo "::error::Could not read the production environment's protection rules, so production was not deployed." >&2
            exit 1
          fi
          if [[ "$reviewers" == "0" ]]; then
            echo "::error::The production environment has no required reviewers. Add them (Settings > Environments > production), then re-run this job." >&2
            exit 1
          fi

      - name: Checkout deploy action
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/actions

      - name: Download site artifact
        uses: actions/download-artifact@v5
        with:
          name: site
          path: .deploy

      - name: Deploy to production
        uses: ./.github/actions/spaceship-deploy
        with:
          local-dir: .deploy/
          remote-dir: ${{ vars.SPACESHIP_REMOTE_DIR || '/' }}
          server: ${{ secrets.SPACESHIP_FTP_SERVER }}
          username: ${{ secrets.SPACESHIP_FTP_USERNAME }}
          password: ${{ secrets.SPACESHIP_FTP_PASSWORD }}
          protocol: ${{ vars.SPACESHIP_FTP_PROTOCOL }}
          port: ${{ vars.SPACESHIP_FTP_PORT }}
          timeout: ${{ vars.SPACESHIP_FTP_TIMEOUT }}
          clean-remote: ${{ inputs.clean_remote || 'false' }}

      - name: Summary
        shell: bash
        env:
          PRODUCTION_URL: ${{ vars.SPACESHIP_PRODUCTION_URL }}
        run: |
          {
            echo "## Deployed ${GITHUB_SHA::7} to production"
            if [[ -n "${PRODUCTION_URL:-}" ]]; then
              echo
              echo "Live at **${PRODUCTION_URL}**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
