<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OrganizationPage Deployment Test</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #e2e8f0;
      }

      main {
        max-width: 42rem;
        padding: 3rem;
        border-radius: 1rem;
        background: rgba(15, 23, 42, 0.85);
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.35);
        text-align: center;
      }

      h1 {
        margin-top: 0;
        font-size: 2.5rem;
      }

      p {
        line-height: 1.6;
      }

      .status {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.75rem 1rem;
        border-radius: 999px;
        background: #22c55e;
        color: #052e16;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Deployment Test Page</h1>
      <p>
        If you can see this page on Spaceship hosting, the automated deployment
        pipeline is working.
      </p>
      <p class="status">GitHub Actions → Spaceship: Connected</p>
    </main>
  </body>
</html>
