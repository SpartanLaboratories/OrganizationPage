<title>Org work board</title>
<script>/* the theme switch's choice (GUIDANCE.md §1, Themes), applied before the first paint; none chosen: the system setting */try{var t=localStorage.getItem("dashboards-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
/* The org work board (plan/RULES.md, the org work board; shared rules: GUIDANCE.md; based on plan/template/board.html, the repository work board, and its
   rules, plan/RULES.md §5). Every run in every repository of the organization at once: one repository Panel per repository, holding that
   repository's runs as its own repository work board draws them (one row per issue that has an issue board or is sized for a run on the tracker, grouped
   by tracking issue in landing order, then the rest by age, each tracking issue's units as a StepBar under its row) and its own Legend,
   then an organization Panel per sub-organization with its repository Panels inside; the parent organization has no container of its own.
   A template plus its data: board.json embedded verbatim below (plan/scripts/org-board.js). The committed board is a snapshot, regenerated at every landing in a repository on the board, read
   from each repository's work-board data (its live view where one exists, else its committed board.json); the live view on this machine (docs/plans/.live/org-work-board/)
   re-reads each sibling checkout's live data as it changes, so it never needs regenerating to follow a run. Never hand-edit a board.
   Colour plan as on every board: --sys-1..12 are the registry slots. On this board they are each repository's own slots, so a colour is read
   within its repository Panel, whose Legend names the systems it drew; status colours only beside a glyph and a word; the accent marks the
   runs being worked on now (a FullPulse: an accent Ring and an interior that breathe) and the next unit up (a still outer Ring and an UP NEXT
   tag); dashed = not started or no board yet. A row with no board takes its state from the tracker (plan/RULES.md §5, "Boardless rows").
   Links depend on where the board is opened (the links block in the script): opened from disk, a link opens the live file in the sibling
   checkout; on the website, the website's form of a link (one function, siteUrl()). */
:root{
  --bg:#f3f5f8; --surface:#fcfcfd; --surface-2:#eef1f6; --ink:#0e1420; --ink-2:#4a5468; --muted:#7d879a;
  --line:#dfe4ec; --hair:rgba(14,20,32,.10);
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --accent:#6d47e0; --on:#0e1420; --focus:#2a78d6; --link:#2a78d6;
  --sys-1:#2a78d6;--sys-2:#653184;--sys-3:#0d7680;--sys-4:#1d2660;--sys-5:#9656aa;--sys-6:#1a9ec7;--sys-7:#203d4b;--sys-8:#7700c7;--sys-9:#008a81;--sys-10:#7780f8;--sys-11:#271ea9;--sys-12:#09534e;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141b;--surface:#171c25;--surface-2:#1f2530;--ink:#eef1f6;--ink-2:#b8c0ce;--muted:#8a93a5;--line:#2a313d;--hair:rgba(255,255,255,.10);--accent:#a58bff;--on:#eef1f6;--focus:#3987e5;--link:#6aa6f0;--sys-1:#3987e5;--sys-2:#8a44d8;--sys-3:#1f8089;--sys-4:#b4bef5;--sys-5:#a86fb8;--sys-6:#31b5f4;--sys-7:#9ae2f4;--sys-8:#c790d0;--sys-9:#11978e;--sys-10:#245eff;--sys-11:#8365bd;--sys-12:#00c7ba;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10141b;--surface:#171c25;--surface-2:#1f2530;--ink:#eef1f6;--ink-2:#b8c0ce;--muted:#8a93a5;--line:#2a313d;--hair:rgba(255,255,255,.10);--accent:#a58bff;--on:#eef1f6;--focus:#3987e5;--link:#6aa6f0;--sys-1:#3987e5;--sys-2:#8a44d8;--sys-3:#1f8089;--sys-4:#b4bef5;--sys-5:#a86fb8;--sys-6:#31b5f4;--sys-7:#9ae2f4;--sys-8:#c790d0;--sys-9:#11978e;--sys-10:#245eff;--sys-11:#8365bd;--sys-12:#00c7ba;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:1280px;margin:0 auto}
/* wide desktop (16:9 screens): the board uses most of the window, as the issue boards do (GUIDANCE.md §6) */
@media (min-width:1500px){.page{max-width:min(2400px,100%)}}
a{color:inherit}
code{font-family:var(--mono);font-size:.92em;overflow-wrap:anywhere;background:var(--surface-2);border:1px solid var(--hair);padding:1px 4px;border-radius:3px}
/* the code label (GUIDANCE.md §12, "Code"; dashboards-skill/42): every inline code drawn as a label of its own,
   in both themes, at normal weight inside bold text; inside a chip, a pill, a tile, a badge or a tag (a label or a figure already: each
   class carries its type word, a tag's a whole part of the class, so .stage, .outage and .tags are not taken) it stays plain mono text */
:is(b,strong,.name,.nm,dt,th) code{font-weight:400}
:is([class*="chip"],[class*="pill"],[class*="tile"],[class*="badge"],[class*="tag-"],[class$="tag"],[class*="tag "]) code{background:none;border:0;padding:0;border-radius:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.crumbs{font-size:12px;color:var(--muted);padding-top:18px}
.crumbs a{text-decoration:none}
/* The header's tools, right of the breadcrumb: the live indicator (the committed board reads "not live · snapshot", the live view follows the
   checkouts) and the theme switch (GUIDANCE.md §1, Themes). The live dot is ink, never a status or accent colour. */
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding-top:18px}
.topbar .crumbs{padding-top:0;min-width:0}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:auto}
.livechip{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--mono);letter-spacing:.03em;padding:5px 9px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink-2);white-space:nowrap}
.livechip:empty{display:none}
.livechip .ld{width:8px;height:8px;border-radius:50%;background:var(--ink);flex:none}
.livechip.on{color:var(--ink);border-color:var(--ink-2)}
.livechip.on.fillpulse .ld{animation:livepulse 1.6s ease-in-out infinite}
.livechip.off .ld{background:none;border:1.5px solid var(--muted)}
.livechip.na .ld{background:var(--muted)}
.livechip a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
@keyframes livepulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.livechip .ld{animation:none!important}}
/* The header's switches (GUIDANCE.md §12, "Switch"): a track with a knob that slides to the side of the state shown, a real toggle
   (role="switch", aria-checked) in the boards' neutrals, never the accent or a status colour. The theme switch's ends are ☀ light and
   ☾ night, its knob at the palette shown. The knob slides in a short transition, and jumps under reduced motion. */
.switch{appearance:none;display:inline-flex;align-items:center;gap:5px;font:600 11px/1 var(--mono);padding:3px 7px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink-2);cursor:pointer;white-space:nowrap}
.switch:hover{color:var(--ink);border-color:var(--ink-2)}
.switch-track{position:relative;flex:none;width:28px;height:16px;border:1px solid var(--ink-2);border-radius:8px;background:var(--surface-2);transition:background-color .18s ease}
.switch-knob{position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--ink-2);transition:transform .18s ease}
.switch[aria-checked="true"] .switch-track{background:color-mix(in srgb,var(--ink-2) 35%,var(--surface))}
.switch[aria-checked="true"] .switch-knob{transform:translateX(12px);background:var(--ink)}
.switch-end{font-size:12px;color:var(--muted)}
.switch[aria-checked="false"] .switch-end.off,.switch[aria-checked="true"] .switch-end.on{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.switch-track,.switch-knob{transition:none}}
h1{font-size:28px;margin:4px 0 2px;letter-spacing:-.01em;font-family:var(--mono)}
.function{color:var(--ink-2);margin:0 0 10px;max-width:78ch;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.chip{font:12px/1 var(--mono);padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink-2);max-width:100%;overflow-wrap:anywhere}
.chip b{color:var(--ink);font-weight:600}
/* The header's two halves (GUIDANCE.md §6, "The header"): from 940 px the intro (the title, the function) fills the left half and the
   tags stand in the right half beside it, each a small card with its label over its value, growing to fill its line, a long one across
   the half (.wide); under 940 px the two stack and the tags wrap as chips, the label before the value. The topbar (the breadcrumb, the
   live indicator, the theme switch) runs across the top. The same rules on every dashboard type. */
.chip .ck{font:700 10px/1.2 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
@media (min-width:940px){
  header{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto auto 1fr;column-gap:28px}
  header>.topbar{grid-column:1/-1;grid-row:1}
  header>h1{grid-column:1;grid-row:2}
  header>.function{grid-column:1;grid-row:3;max-width:none}
  header>.chips{grid-column:2;grid-row:2/-1;align-self:start;align-content:flex-start;gap:8px;margin:8px 0 6px}
  header>.chips>.chip{display:block;flex:1 1 190px;padding:7px 10px 8px;font-size:12.5px;line-height:1.4;border-radius:6px}
  header>.chips>.chip .ck{display:block;margin:0 0 2px}
  header>.chips>.chip.wide{flex-basis:100%}
}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0 18px}
.kpi-tile{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0}
.kpi-tile .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.kpi-tile .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi-tile .s{font-size:12px;color:var(--ink-2);margin-top:2px}
/* A tile that counts states carries a segmented bar of them, its legend inside the tile (GUIDANCE.md §2, "Figures"): the Runs and the Landed
   tiles. A tile that counts one state (active, waiting, up next, not started) has nothing to segment and carries none. */
.kpi-tile .seg-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px;margin-top:8px;background:var(--surface-2)}
.kpi-tile .seg-bar i{display:block;height:100%;background:var(--ink-2)}
.seg-bar i.good{background:var(--good)}.seg-bar i.warning{background:var(--warning)}.seg-bar i.serious{background:var(--serious)}.seg-bar i.critical{background:var(--critical)}.seg-bar i.neutral{background:var(--muted)}.seg-bar i.accent{background:var(--accent)}
.seg-bar i.hollow{background:none!important;border:1.5px solid var(--good)}
.seg-bar i.pln{background:none!important;border:1.5px dashed var(--muted)}
.kpi-tile .legend{margin-top:6px;gap:4px 10px;font-size:11px}
.legend i.segk{width:14px;height:6px;border:0;border-radius:2px;background:var(--sc,var(--ink-2))}
.legend i.segk.good{--sc:var(--good)}.legend i.segk.warning{--sc:var(--warning)}.legend i.segk.serious{--sc:var(--serious)}.legend i.segk.critical{--sc:var(--critical)}.legend i.segk.neutral{--sc:var(--muted)}.legend i.segk.accent{--sc:var(--accent)}
.legend i.segk.hollow{background:none;border:1.5px solid var(--good);height:7px}
.legend i.segk.pln{background:none;border:1.5px dashed var(--muted);height:7px}
/* the Context's legend (GUIDANCE.md §2): the encodings its cards draw */
.context>.legend{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 12px;margin-top:10px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto;overflow-y:hidden}
.tab{appearance:none;border:0;background:none;color:var(--ink-2);font:inherit;font-weight:600;padding:10px 14px;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab.model::after{content:" JSON";font:10px var(--mono);color:var(--muted);vertical-align:super}
.view{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;min-width:0}
.view h2{font-size:15px;margin:0 0 4px}
.lede{font-size:13px;color:var(--ink-2);margin:0 0 10px;max-width:90ch}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:10px 0 0;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:16px;height:11px;border-radius:3px;border:1.5px solid var(--ink-2);background:var(--surface);flex:none}
.legend i.sbar{border-color:var(--line);border-left:4px solid var(--c)}
.legend i.pln{border-style:dashed;background:none;border-color:var(--muted)}
.legend i.gl{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface));box-shadow:inset 0 0 4px 1px color-mix(in srgb,var(--accent) 60%,transparent)}
.legend i.nx{border-color:color-mix(in srgb,var(--accent) 70%,transparent);box-shadow:0 0 6px 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.verdict-pill{--sc:var(--muted);display:inline-flex;align-items:center;gap:5px;font:600 10.5px/1.2 var(--mono);padding:2px 6px;border-radius:3px;border:1px solid var(--line);border-left:3px solid var(--sc);background:color-mix(in srgb,var(--sc) 14%,var(--surface));color:var(--ink);white-space:nowrap}
.verdict-pill i,.legend .verdict-pill i{font-style:normal;font-weight:700;display:inline;width:auto;height:auto;border:0;border-radius:0;background:none;box-shadow:none}
/* a tracking issue's chain (plan/RULES.md §3, "The chain's progress"): the summary in its state cell, and its units as a StepBar on a row
   of its own under it, across the table (dashboards-skill/54; a board.json written before the bar's units: the bar from its unit rows) */
.chainsum{font-size:12px;color:var(--ink-2);line-height:1.4;min-width:0;overflow-wrap:anywhere}
.chainsum b{color:var(--ink)}
.chainsum a{text-decoration:none;border-bottom:1px solid var(--line)}
/* The StepBar (nomenclature/ui.md, StepBar; dashboards-skill/54): the steps of a sequence in order, each a chevron with its name inside,
   done, current or to come. An ordered list, the current step aria-current="step", each step's state said in words to a screen reader
   (.sb-st). It stands on a line of its own and wraps inside itself at phone width, never widening the board; a long name wraps inside its
   chevron. Done: solid, the strong neutral with a faint wash; current: solid, in ink and bold; to come: dashed and muted. Each chevron is
   its list item clipped to the shape, its edge (::before) and its fill (::after) layered inside it, so a dashed edge and a mark follow the
   chevron; each nests into the notch of the next. The same rules on every dashboard type that draws one. */
.stepbar{list-style:none;margin:6px 0 2px;padding:0 0 0 7px;display:flex;flex-wrap:wrap;gap:4px 0;min-width:0;max-width:100%}
.stepbar>li{--sb-edge:var(--ink-2);--sb-fill:color-mix(in srgb,var(--ink-2) 14%,var(--surface));--sb-w:1.5px;position:relative;z-index:0;display:flex;align-items:center;min-width:0;max-width:calc(100% + 7px);min-height:26px;margin-left:-7px;padding:4px 15px 4px 19px;font:11.5px/1.25 var(--mono);color:var(--ink);overflow-wrap:anywhere;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%,10px 50%)}
.stepbar>li:first-child{padding-left:11px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%)}
.stepbar>li::before,.stepbar>li::after{content:"";position:absolute;inset:0;z-index:-2;background:var(--sb-edge)}
.stepbar>li::after{z-index:-1;inset:var(--sb-w);background:var(--sb-fill);clip-path:polygon(1px 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,1px 100%,10.5px 50%)}
.stepbar>li:first-child::after{clip-path:polygon(0 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,0 100%)}
.stepbar>li.cur{--sb-edge:var(--ink);--sb-fill:color-mix(in srgb,var(--ink) 7%,var(--surface));--sb-w:2px;font-weight:700}
.stepbar>li.todo{--sb-edge:repeating-linear-gradient(90deg,var(--muted) 0 5px,transparent 5px 9px);--sb-fill:var(--surface);color:var(--muted)}
.stepbar .sb-st{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.legend i.sbk{position:relative;z-index:0;width:22px;height:12px;border:0;border-radius:0;background:none;--sb-edge:var(--ink-2);--sb-fill:color-mix(in srgb,var(--ink-2) 14%,var(--surface));--sb-w:1.5px;clip-path:polygon(0 0,calc(100% - 6px) 0,100% 50%,calc(100% - 6px) 100%,0 100%,6px 50%)}
.legend i.sbk::before,.legend i.sbk::after{content:"";position:absolute;inset:0;z-index:-2;background:var(--sb-edge)}
.legend i.sbk::after{z-index:-1;inset:var(--sb-w);background:var(--sb-fill);clip-path:polygon(1px 0,calc(100% - 5px) 0,100% 50%,calc(100% - 5px) 100%,1px 100%,6.5px 50%)}
.legend i.sbk.cur{--sb-edge:var(--ink);--sb-fill:color-mix(in srgb,var(--ink) 7%,var(--surface));--sb-w:2px}
.legend i.sbk.todo{--sb-edge:repeating-linear-gradient(90deg,var(--muted) 0 3px,transparent 3px 5px);--sb-fill:var(--surface)}
.tbl tr.chainrow>td{border-top:0;padding:0 6px 10px;border-left:4px solid var(--c,var(--muted))}
.tbl tr.chainrow .stepbar{margin:0}
.tbl .stepbar>li{font-size:12px}
.verdict-pill.good{--sc:var(--good)}.verdict-pill.warning{--sc:var(--warning)}.verdict-pill.serious{--sc:var(--serious)}.verdict-pill.critical{--sc:var(--critical)}
.verdict-pill.neutral,.verdict-pill.hollow{background:var(--surface)}
/* Depends on, and Blocks · enables (plan/RULES.md §5; dashboards-skill/30): each issue with a small pill of its state, glyph and word */
.deps{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.dep-item{display:inline-flex;flex-wrap:wrap;align-items:center;gap:2px 5px;min-width:0}
.dep-item .verdict-pill{font-size:9.5px;padding:1px 5px}
/* one pill per dependency, two parts: its build state (a status pill) and its locality (a neutral ramp, faintest near, full ink far) */
.dep-pill{display:inline-flex;align-items:stretch;border-radius:3px;white-space:nowrap}
.dep-pill>.verdict-pill{border-top-right-radius:0;border-bottom-right-radius:0}
.loc{--lc:var(--muted);display:inline-flex;align-items:center;gap:4px;font:600 9.5px/1.2 var(--mono);padding:1px 5px;border:1px solid var(--line);border-left:3px solid var(--lc);border-radius:3px;background:var(--surface);color:var(--ink-2);white-space:nowrap}
.dep-pill>.verdict-pill+.loc{border-left-width:3px;border-top-left-radius:0;border-bottom-left-radius:0;margin-left:-1px}
.loc i{font-style:normal;font-weight:700}
.loc.l1{--lc:color-mix(in srgb,var(--ink) 22%,var(--surface))}.loc.l2{--lc:color-mix(in srgb,var(--ink) 45%,var(--surface))}.loc.l3{--lc:color-mix(in srgb,var(--ink) 70%,var(--surface))}.loc.l4{--lc:var(--ink)}
.legend .loc i,.legend .dep-pill i{display:inline;width:auto;height:auto;border:0;background:none;box-shadow:none}
.verdict-pill.dashed{border-style:dashed;color:var(--ink-2)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c,var(--muted));flex:none;vertical-align:-1px;margin-right:5px}
/* In progress (GUIDANCE.md §1): a FullPulse (.fullpulse), a solid accent Ring with an interior that breathes, over an accent wash. With
   reduced motion it holds still at its middle strength. Up next: a still outer Ring (.upnext-ring), with the UP NEXT tag beside it. */
@keyframes fullpulse{0%,100%{box-shadow:inset 0 0 0 2px var(--accent),inset 0 0 3px 1px color-mix(in srgb,var(--accent) 35%,transparent)}50%{box-shadow:inset 0 0 0 2px var(--accent),inset 0 0 9px 3px color-mix(in srgb,var(--accent) 65%,transparent)}}
.verdict-pill.fullpulse,.fullpulse{animation:fullpulse 2s ease-in-out infinite;background:color-mix(in srgb,var(--accent) 16%,var(--surface));border-color:var(--accent);border-left-color:var(--sc,var(--accent))}
@media (prefers-reduced-motion:reduce){.verdict-pill.fullpulse,.fullpulse{animation:none!important;box-shadow:inset 0 0 0 2px var(--accent),inset 0 0 6px 2px color-mix(in srgb,var(--accent) 50%,transparent)}}
/* A run that waits on you, halted or escalated, keeps its in-progress mark stopped to the Ring alone (GUIDANCE.md §1): still. */
.verdict-pill.held{box-shadow:inset 0 0 0 2px var(--accent)}
.legend i.hold{border:2px solid var(--accent)}
.upnext-ring{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--accent) 70%,transparent),0 0 9px 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.tag-next{display:inline-block;font:700 9.5px/1 var(--mono);letter-spacing:.08em;padding:3px 5px;border-radius:3px;border:1px solid var(--accent);color:var(--accent);background:var(--surface);white-space:nowrap;vertical-align:1px}
.tags{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin-top:4px}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:900px}
.tbl th,.tbl td{text-align:left;padding:7px 6px;border-top:1px solid var(--hair);vertical-align:top}
.tbl td{overflow-wrap:anywhere}
.tbl th{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-top:0}
.tbl tr.run>:first-child{border-left:4px solid var(--c,var(--muted))}
/* the columns' shares (dashboards-skill/30: no branch or board column; the issue's title is its board's link, the branch is in the state) */
.tbl thead th:nth-child(1){width:22%}.tbl thead th:nth-child(2){width:14%}.tbl thead th:nth-child(4){width:14%}.tbl thead th:nth-child(5){width:15%}.tbl thead th:nth-child(6){width:12%}
.tbl tr.run.nob>:first-child{border-left-style:dashed}
.tbl tr.grp th{padding-top:16px;font:700 11px var(--sans);color:var(--muted);letter-spacing:.07em;text-transform:uppercase}
.tbl tr.grp th a{text-decoration:none;border-bottom:1px solid var(--line);text-transform:none;letter-spacing:0;font-family:var(--mono);font-weight:400}
.tbl .t{color:var(--ink)}
.tbl tr.grp th a+a{font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit}
.tbl .sub{font-size:11.5px;color:var(--muted);margin-top:2px;font-family:var(--mono)}
.tbl a{text-decoration:none;border-bottom:1px solid var(--line)}
.tbl small{color:var(--ink-2)}
/* The runs table's content, larger (dashboards-skill/31): every column but Now (the issue, the state with its branch, the qa
   passes, Depends on, Blocks · enables), with their pills, scaled up to read comfortably and fill the room; Now keeps its size.
   Under 880 px each run is a card of its cells, each labelled, so the board never scrolls sideways and nothing scrolls inside the table. */
.tbl{font-size:14.5px;min-width:1000px}
.tbl th,.tbl td{padding:9px 8px}
.tbl th{font-size:11.5px}
.tbl .t{font-size:15px;line-height:1.4}
.tbl .sub{font-size:12.5px;margin-top:3px}
.tbl small{font-size:12px}
.tbl .verdict-pill{font-size:12px;padding:3px 8px;gap:6px}
.tbl .dep-item .verdict-pill,.tbl .loc{font-size:11.5px;padding:2px 7px}
.tbl .dep-item{gap:3px 6px}
.tbl .deps{gap:6px}
.tbl .tags{gap:5px 7px;margin-top:6px}
.tbl .tag-next{font-size:11px;padding:4px 6px}
.tbl .chainsum{font-size:13.5px}
.tbl td:nth-child(3){font-size:12.5px}
.tbl td:nth-child(3) .sub{font-size:11.5px}
.tbl td:nth-child(3) small{font-size:inherit}
@media (min-width:1500px){.tbl{font-size:15px}.tbl .t{font-size:15.5px}.tbl .verdict-pill{font-size:12.5px}.tbl .dep-item .verdict-pill,.tbl .loc{font-size:12px}.tbl .qamark{font-size:12px}.tbl .chainsum{font-size:14px}}
@media (max-width:879.98px){
  .tbl{min-width:0}
  .tbl,.tbl tbody,.tbl tr.grp,.tbl tr.grp th{display:block}
  .tbl thead{display:none}
  .tbl tr.grp th{padding:16px 6px 6px}
  .tbl tr.run{display:grid;grid-template-columns:minmax(0,1fr);border-top:1px solid var(--line);border-left:4px solid var(--c,var(--muted));padding:4px 0 6px}
  .tbl tr.run.nob{border-left-style:dashed}
  .tbl tr.run>:first-child{border-left:0}
  .tbl tr.run>td{display:block;border-top:0;padding:5px 10px;min-width:0}
  .tbl tr.run>td:empty{display:none}
  .tbl tr.run>td:nth-child(2){order:1}.tbl tr.run>td:nth-child(4){order:2}.tbl tr.run>td:nth-child(3){order:3}.tbl tr.run>td:nth-child(5){order:4}.tbl tr.run>td:nth-child(6){order:5}
  .tbl tr.run>td:nth-child(n+2)::before{display:block;font:600 10.5px/1.3 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .tbl tr.run>td:nth-child(2)::before{content:"State"}.tbl tr.run>td:nth-child(3)::before{content:"Now"}.tbl tr.run>td:nth-child(4)::before{content:"Quality Reviews"}.tbl tr.run>td:nth-child(5)::before{content:"Depends on"}.tbl tr.run>td:nth-child(6)::before{content:"Blocks · enables"}
  .tbl .verdict-pill,.tbl .qamark,.tbl .dep-pill{white-space:normal;max-width:100%}
  .tbl tr.chainrow,.tbl tr.chainrow>td{display:block}
  .tbl tr.chainrow>td{padding:0 10px 10px}
}
@media (min-width:600px) and (max-width:879.98px){
  .tbl tr.run{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .tbl tr.run>td:nth-child(1),.tbl tr.run>td:nth-child(3){grid-column:1/-1}
}
/* the decision not to run another qa pass (dashboards-skill/31): a small neutral mark beside the pass, its glyph and words */
/* tree-css:begin. The issue tree (plan/RULES.md §5, §10): a repository's Rows nested by the real sub-issue chain, to any depth, indented by depth (at most four steps, so a long chain never squeezes
   the title away) with neutral guide lines, a Button on every Row that owns sub-issues. The system colour stays on the Row's edge; nothing here is a status. */
.tbl tr[hidden]{display:none!important}
/* the State and Quality Review pills wrap as the narrow layout does, so the tree's indent never starves the Now column */
.tbl td:nth-child(2) .verdict-pill,.tbl td:nth-child(4) .verdict-pill{white-space:normal}
.tbl tr.run[data-node]{--tx:calc(8px + min(var(--d,0),4)*16px);--ty:7px}
.tbl tr.run[data-node]>td:first-child{position:relative;padding-left:calc(var(--tx) + 28px)}
.tbl tr.run[data-kids] .t{font-weight:600}
.tg{position:absolute;top:0;bottom:0;left:calc(20px + min(var(--i),4)*16px);width:6px;pointer-events:none}
.tg.v,.tg.t,.tg.l{border-left:1px solid var(--line)}
.tg.l{bottom:auto;height:19px}
.tg.t::after,.tg.l::after{content:"";position:absolute;left:0;top:18px;width:6px;border-top:1px solid var(--line)}
.tw{position:absolute;left:var(--tx);top:var(--ty);width:24px;height:24px;display:grid;place-items:center;padding:0;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--ink-2);cursor:pointer;font:600 16px/1 var(--mono)}
.tw::before{content:"\25B8"}
.tw[aria-expanded="true"]::before{content:"\25BE"}
.tw:hover{border-color:var(--line);background:var(--surface-2);color:var(--ink)}
.tw:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.twk{font:600 12px/1 var(--mono);color:var(--ink-2)}
.tbl ol.stepbar[data-tree-d]{margin-left:calc(min(var(--d,0),4)*16px)}
@media (max-width:879.98px){
  .tbl tr.run[data-node]{--tx:8px;--ty:2px;margin-left:calc(min(var(--d,0),4)*14px)}
  .tg{display:none}
  .tbl ol.stepbar[data-tree-d]{margin-left:0}
}
/* tree-css:end */
.qas{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.qa1{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 6px;max-width:100%}
.qamark{display:inline-flex;align-items:center;gap:4px;font:600 10.5px/1.2 var(--mono);padding:2px 6px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink-2);white-space:nowrap}
.tbl .qamark{font-size:11.5px;padding:2px 7px}
.qamark i,.legend .qamark i{font-style:normal;font-weight:700;display:inline;width:auto;height:auto;border:0;background:none;box-shadow:none}
.verdict-pill a,.kpi-tile .s a{text-decoration:none;border-bottom:1px solid var(--line)}
pre.src{margin:0;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:14px;font:12px/1.5 var(--mono);overflow:auto;color:var(--ink);max-height:70vh}
.context{margin-top:24px}
.context h2{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0}
.card h3{font-size:13px;margin:0 0 8px}
.card h3 small{font-weight:400;color:var(--muted);font-family:var(--mono);font-size:11px}
/* the Ideas Panel (plan/RULES.md §10): one idea Card per idea of the organization's ideas file, its kind as a Tag; no state, so no colour */
.ideas-panel{margin-top:18px;border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--surface)}
.ideas-panel>.repo-head h3{margin:0 0 8px}
.idea-card p{margin:0;overflow-wrap:anywhere}
.idea-card p+p{margin-top:6px;font-size:12px;color:var(--ink-2)}
.tag-kind{display:inline-block;font:700 9.5px/1 var(--mono);letter-spacing:.06em;padding:3px 5px;border-radius:3px;border:1px solid var(--ink-2);color:var(--ink-2);background:var(--surface);white-space:nowrap;vertical-align:1px;text-transform:uppercase}
.issues{list-style:none;margin:0;padding:0;font-size:12.5px}
.issues li{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding:5px 0;border-top:1px solid var(--hair);align-items:start}
.issues span.nm>a:first-of-type,.tbl .t>a:first-child,.grp>th>a:first-child{font-family:var(--mono);color:var(--ink-2)}
.issues span{color:var(--ink-2);min-width:0;overflow-wrap:anywhere}
.issues span a{text-decoration:none;border-bottom:1px solid var(--line)}
.issues ul{grid-column:1/-1;list-style:none;margin:2px 0 0;padding:0 0 0 14px}
.issues li.rp{border-top:0;padding-top:8px}
.issues li.rp>b{font:600 12px var(--sans);color:var(--ink)}
.docs{margin:0;padding:0;list-style:none;font-size:12.5px}
.docs li{padding:4px 0;border-top:1px solid var(--hair);color:var(--ink-2)}
.docs li.rp{border-top:0;padding-top:8px;font-weight:600;color:var(--ink)}
.docs a{text-decoration:none;border-bottom:1px solid var(--line);color:var(--ink)}
footer{margin-top:28px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
footer code{color:var(--ink-2)}
/* an archived system (registry status "archived", dashboards-skill/35): neutral through its slot 0, solid, faded, a neutral tag beside its name */
.sysarch,.sbar.arch{opacity:.6;filter:saturate(.35)}
.archtag{display:inline-block;font:700 10px/1.2 var(--mono);letter-spacing:.04em;color:var(--ink-2);padding:1px 5px;border:1px solid var(--muted);border-radius:3px;background:var(--surface-2);margin-left:4px}
/* The org work board's Panels. A repository Panel (.repo-panel): the repository's name (the link to it on GitHub), its default branch and
   what the snapshot read, then its runs table and its own Legend, as its repository work board draws them; a repository with no
   work-board data in the snapshot shows its head and says so (solid: nothing planned). An organization Panel (.org-panel): a sub-organization,
   its repository Panels inside. Both are Panels (nomenclature/ui.md): a region under its own heading. */
.repo-panel{border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:10px;margin:0 0 14px;min-width:0}
.repo-panel:last-child{margin-bottom:0}
.repo-head{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 14px;min-width:0}
.repo-head h3,.repo-head h4{font-size:17px;margin:0;font-family:var(--mono);letter-spacing:-.01em;overflow-wrap:anywhere}
.repo-head :is(h3,h4) a{text-decoration:none;border-bottom:1px solid var(--line)}
.repo-head :is(h3,h4) small{font:400 12px var(--mono);color:var(--muted);margin-left:8px}
.repo-head .sub{font-size:12.5px;color:var(--ink-2);margin-top:4px;overflow-wrap:anywhere}
.repo-head .sub a{text-decoration:none;border-bottom:1px solid var(--line)}
.repo-head .stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.repo-head .stats .chip{padding:4px 7px;font-size:11.5px}
.repo-panel>.scroll{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.repo-panel>.legend{margin-top:8px;padding:0 4px}
.repo-panel.empty .repo-head{border-color:var(--line)}
.repo-panel.empty>.legend{padding:0 4px;margin-top:8px}
.org-panel{border:2px solid var(--ink-2);border-radius:8px;padding:10px;margin:18px 0 0;background:var(--surface-2);min-width:0}
.org-panel>.repo-head{margin-bottom:12px}
.org-panel>.repo-head h3{font-size:19px}
.repo-head :is(h3,h4):has(>.tw){display:flex;flex-wrap:wrap;align-items:center}
.repo-head .tw{position:static;flex:none;margin:0 6px 0 -4px}
.repo-panel>[hidden]{display:none}
.repos-lede{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:14px 0 8px}
/* the displays' wiring (displays:begin in the script): a host stands empty until its display draws; a display that could not be drawn says so in one line */
.slot-host:empty{display:none}
.draw-failed{margin:6px 0;padding:6px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface-2);color:var(--ink-2);font-size:12.5px}
span.draw-failed{display:inline-block;margin:0 4px;padding:0 5px;font-size:11px}
/* the slots' CSS (verify/slots.json), each owned by one job */
/* slot s38 begin */
/* The inspector (plan/RULES.md §5, "The inspector"; GUIDANCE.md §6, "The inspector Switch"): the side Panel that shows what the board's one
   selection chose, its Hide Button right of its heading. It stands while a display that opens entries in it has something to draw
   (.work-stage.insp-on). From 1500 px it is the stage's second column, sticky, scrolling inside itself; under 1500 px it stands after the
   display that was used, or after the Tab panels, so the runs table keeps its width. Hidden (the inspector Switch, or its Hide Button),
   the Tab panels take its width. The boards' neutrals only: no accent, no status colour, no animation. */
#inspector[hidden],.switch[hidden]{display:none!important}
.work-stage:not(.insp-on)>.inspector{display:none}
.inspector{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0;font-size:13px;overflow-wrap:anywhere}
.work-stage>.inspector{margin-top:12px}
.work-views .inspector{margin:10px 0 14px;border-color:var(--ink-2)}
:root[data-inspector="hidden"] .inspector{display:none}
@media (min-width:1500px){
  .work-stage.insp-on{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,420px);column-gap:16px;align-items:start}
  .work-stage.insp-on>.work-views{grid-column:1;grid-row:1;min-width:0}
  .work-stage.insp-on>.inspector{grid-column:2;grid-row:1;margin-top:0;position:sticky;top:calc(12px + env(safe-area-inset-top,0px));max-height:calc(100vh - 24px - env(safe-area-inset-top,0px));overflow:auto}
  :root[data-inspector="hidden"] .work-stage.insp-on{grid-template-columns:minmax(0,1fr)}
}
.inspector .insp-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px}
.inspector .insp-head h2{margin:0;font-size:15px}
.inspector #insp-body:focus{outline:none}
.inspector #insp-body:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.inspector p{margin:0 0 8px;color:var(--ink-2)}
.inspector p.insp-gone{color:var(--ink)}
.inspector dl{margin:0}
.inspector dt{font:600 11px var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-top:10px}
.inspector dd{margin:2px 0 0;color:var(--ink-2)}
.inspector a{text-decoration:none;border-bottom:1px solid var(--line)}
.inspector a:hover{border-bottom-color:var(--ink)}
.hide-button{appearance:none;display:inline-flex;align-items:center;gap:4px;flex:none;font:600 11px/1 var(--mono);letter-spacing:.03em;padding:4px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink-2);cursor:pointer;white-space:nowrap}
.hide-button:hover{color:var(--ink);border-color:var(--ink-2)}
.hide-button svg{flex:none;width:14px;height:14px}
/* slot s38 end */
/* slot s39 begin */
/* each Quality Review's findings under its slot of a SlotBar (slotBarFindings()): one entry per slot, aligned with the SlotBar's slots, words
   only; the same block in the issue board's, the repository work board's and the org work board's slots, so any SlotBar of passes draws it */
.slotbar-findings{display:flex;gap:2px;margin-top:4px}
.slotbar-findings .slotbar-finding{flex:1 1 0;min-width:0;text-align:center}
.slotbar-finding b{display:block;font-weight:700;font-size:13px;line-height:1.15;color:var(--ink)}
.slotbar-finding small{display:block;font-weight:500;font-size:10.5px;line-height:1.25;color:var(--ink-2);letter-spacing:.02em;overflow-wrap:anywhere}
.slotbar-finding.none b{color:var(--ink-2)}
.slotbar-findings-line{font-size:12.5px;color:var(--ink-2);margin-top:4px}
/* each Quality Review's findings beside its Pill in a repository Panel's Quality Reviews column (passFindingsLabel()), words only */
.review-findings{font:500 11.5px/1.3 var(--mono);color:var(--ink-2)}
.legend .review-findings{white-space:nowrap}
/* slot s39 end */
/* slot s40 begin */
/* The cumulative flow of the issues on the board (the same rules in the three work-board templates): neutral inks only, the two lines told apart
   by weight (filed thin, landed thick), the band between them a faint ink wash; the chosen day's point outlined in ink; no line broken into dashes
   (nothing on it is planned), no status colour, no accent */
.flow-figure{margin:6px 0 14px;min-width:0}
.flow-figure .lede{margin:0 0 6px}
.flow-frame{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.flow-svg{display:block}
.flow-svg text{font:11px var(--sans);fill:var(--ink-2)}
.flow-svg .flow-grid{stroke:var(--hair);stroke-width:1}
.flow-svg .flow-axis{stroke:var(--line);stroke-width:1}
.flow-svg .flow-date{font:600 10.5px var(--sans);fill:var(--muted)}
.flow-svg .flow-band{fill:color-mix(in srgb,var(--ink) 9%,transparent)}
.flow-svg .flow-opened{fill:none;stroke:var(--ink-2);stroke-width:1.5}
.flow-svg .flow-landed{fill:none;stroke:var(--ink);stroke-width:3}
.flow-svg .flow-end{font:700 11px var(--sans);fill:var(--ink)}
.flow-svg .flow-open{font:10.5px var(--sans);fill:var(--muted)}
.flow-svg .flow-dot{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.flow-svg .flow-dot.filed{stroke:var(--ink-2)}
.flow-svg .flow-hit{fill:transparent}
.flow-svg .flow-point{cursor:pointer}
.flow-svg .flow-point:focus{outline:none}
.flow-svg .flow-point:focus-visible .flow-hit{stroke:var(--focus);stroke-width:2}
.flow-svg .flow-point.sel .flow-hit{fill:color-mix(in srgb,var(--ink) 10%,transparent)}
.flow-svg .flow-point.sel .flow-dot{stroke:var(--ink);stroke-width:3}
.legend i.flow-key{width:20px;height:0;border:0;border-radius:0;background:none;box-shadow:none}
.legend i.flow-key.opened{border-top:1.5px solid var(--ink-2)}
.legend i.flow-key.landed{border-top:3px solid var(--ink)}
.legend i.flow-key.band{width:18px;height:10px;background:color-mix(in srgb,var(--ink) 9%,transparent)}
.legend i.flow-key.point{width:9px;height:9px;border:1.5px solid var(--ink);border-radius:50%;background:var(--surface)}
.flow-list{margin-top:8px;font-size:12.5px;color:var(--ink-2)}
.flow-list>summary{cursor:pointer;font-weight:600}
.flow-list table{width:100%;border-collapse:collapse;margin-top:4px}
.flow-list td{padding:3px 6px;border-top:1px solid var(--hair);vertical-align:top;overflow-wrap:anywhere;min-width:0}
.flow-list td.flow-n{font-family:var(--mono);text-align:right;white-space:nowrap}
.flow-list button{appearance:none;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);font:600 11.5px var(--mono);padding:1px 6px;cursor:pointer;white-space:nowrap}
.flow-list button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.flow-list button.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.flow-issues{margin:0;padding-left:16px}
.flow-small{margin:10px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.flow-small .flow-frame{border-color:var(--hair)}

<body>
<div class="page">
<header>
  <div class="topbar"><div class="crumbs" id="crumbs"></div><div class="tools"><span class="livechip off" id="live"></span><button class="switch" id="theme" type="button" role="switch" aria-checked="false"></button></div></div>
  <h1>Org work board</h1>
  <p class="function" id="function"></p>
  <div class="chips" id="chips"></div>
</header>
<div class="kpis" id="kpis"></div>
<div class="tabs" role="tablist" aria-label="Views">
  <button class="tab" role="tab" id="t-repos" aria-controls="p-repos" aria-selected="true">Repositories</button>
  <button class="tab model" role="tab" id="t-source" aria-controls="p-source" aria-selected="false">Source</button>
</div>
<!-- the Tab panels and, beside them, the inspector's slot (verify/slots.json): .work-stage holds .work-views and the inspector; laid out by the inspector's slot -->
<div class="work-stage" id="work-stage"><div class="work-views">
<section class="view" role="tabpanel" id="p-repos" aria-labelledby="t-repos">
  <h2>Every run in every repository, each repository's issues as a tree of its sub-issue chain, then the rest by age</h2>
  <p class="lede" id="repos-lede"></p>

const TREE_KEY="dashboards-tree-org";

   board records (chain.units) is drawn as recorded; this is for the rest, a tracking issue with no board first. A level nested only by its folder is no sub-issue. Cancelled, not planned and duplicate are out of the chain, as they are out of its

  if(x.row?["abandoned","not-planned","duplicate"].includes(s):x.state==="CLOSED"&&["NOT_PLANNED","DUPLICATE"].includes(x.stateReason)) return null;
  if(x.row?["landed","merged"].includes(s):x.state==="CLOSED") return "done";

   its drawing; has(), whether the board's data gives it anything to draw (its Tab is added only then; none given: always); inspect(key), the
   inspector's text for a key it drew; idle, the inspector's text on its Tab before anything is chosen. Each display is drawn through
   safeDraw(): an error draws one line in its place saying it could not be drawn, and the rest of the board stands. A display is drawn only
   while its host is shown, and again once it is shown after a redraw (draw-on-show: nothing is measured in a hidden Tab). The board has one

   (selectKey(key or [keys], its id); selectedKeys() reads it), every element of a chosen key marked, and the choosing display's inspect()

   what an existing renderer draws through addHook(name, fn): the renderer asks hook(name, ...) where a slot may add, each handler guarded
   alike. The Tabs the displays bring are added at load (addDisplayPlaces(), from DISPLAY_TABS and TAB_LABELS), only where a display in them

const flowLong=d=>flowShort(d)+" "+new Date(flowT(d)).getUTCFullYear();
const flowCount=(n,one,many)=>n+" "+(n===1?one:(many||one+"s"));
/* The model: items [{ issue, title, created, landed, isLanded, closed }] and the board's own date; start, when given, shares a date axis
   (the org work board). Returns { rows, days: [{ d, op, ld, o, l }], start, end, opened, landed, noFiled, noLanded, before, closed }. */
function flowModel(items,boardDate,start){
  const M={rows:[],days:[],start:null,end:null,opened:0,landed:0,noFiled:0,noLanded:0,before:0,closed:0};
  (items||[]).forEach(x=>{ if(!x) return; if(x.closed){ M.closed++; return; } const c=flowDay(x.created); if(!c){ M.noFiled++; return; }
    let l=x.isLanded?flowDay(x.landed):null; if(x.isLanded&&!l) M.noLanded++; if(l&&l<c){ M.before++; l=null; } M.rows.push(Object.assign({},x,{c,l})); });
  if(!M.rows.length) return M;
  const by=new Map(), at=d=>{ if(!by.has(d)) by.set(d,{d,op:[],ld:[]}); return by.get(d); };
  M.rows.forEach(r=>{ at(r.c).op.push(r); if(r.l) at(r.l).ld.push(r); });
  let o=0,l=0; M.days=[...by.values()].sort((a,b)=>a.d<b.d?-1:1).map(x=>{ o+=x.op.length; l+=x.ld.length; return Object.assign(x,{o,l}); });
  const first=M.days[0].d, last=M.days[M.days.length-1].d, bd=flowDay(boardDate);
  M.start=flowDay(start)&&flowDay(start)<first?flowDay(start):first; M.end=bd&&bd>last?bd:last; M.opened=o; M.landed=l;
  return M; }
/* the last day drawn: the board's own date or a shared one (o.end), never before the last day recorded */
const flowEnd=(M,o)=>flowDay(o&&o.end)&&flowDay(o.end)>M.end?flowDay(o.end):M.end;
/* the SVG: o { w, small, end (a shared last day), key(day), label } */
function flowSvg(M,o){
  const W=Math.max(240,Math.round(o.w||640)), H=o.small?118:196, L=32, R=o.small?70:86, T=10, B=o.small?20:26, pw=W-L-R, ph=H-T-B;
  const end=flowEnd(M,o), days=Math.round((flowT(end)-flowT(M.start))/FLOW_DAY)+1, pxd=pw/days;
  const X=d=>L+pw*((flowT(d)-flowT(M.start))/FLOW_DAY+0.5)/days, xe=L+pw, max=Math.max(1,M.opened), Y=v=>T+ph*(1-v/max), f=v=>Math.round(v*10)/10;
  const pts=[{x:L,o:0,l:0},...M.days.map(x=>({x:X(x.d),o:x.o,l:x.l}))];
  const step=k=>"M"+f(L)+" "+f(Y(0))+pts.slice(1).map(p=>" H"+f(p.x)+" V"+f(Y(p[k]))).join("")+" H"+f(xe);
  let band=step("o")+" V"+f(Y(pts[pts.length-1].l)); for(let i=pts.length-1;i>=1;i--) band+=" H"+f(pts[i].x)+" V"+f(Y(pts[i-1].l)); band+=" H"+f(L)+" Z";
  const gs=[1,2,5,10,20,50,100,200,500].find(g=>max/g<=4)||1000;
  let s=`<svg class="flow-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="group" aria-label="${flowEsc(o.label)}">`;
  for(let v=0;v<=max;v+=gs) s+=`<line class="flow-grid" x1="${L}" x2="${f(xe)}" y1="${f(Y(v))}" y2="${f(Y(v))}"/><text x="${L-5}" y="${f(Y(v)+4)}" text-anchor="end">${v}</text>`;
  /* the date labels: every day where they fit, else Mondays, else the first of each month, never closer than 48 px */
  const all=[]; for(let i=0;i<days;i++) all.push(new Date(flowT(M.start)+i*FLOW_DAY).toISOString().slice(0,10));
  const wd=d=>new Date(flowT(d)).getUTCDay(), md=d=>Number(d.slice(8,10));
  let ticks=pxd>=48?all:pxd*7>=48?all.filter(d=>wd(d)===1):all.filter(d=>md(d)===1); if(!ticks.length) ticks=[all[0]];
  const kept=[]; ticks.forEach(d=>{ if(!kept.length||X(d)-X(kept[kept.length-1])>=48) kept.push(d); });
  s+=`<line class="flow-axis" x1="${L}" x2="${f(xe)}" y1="${f(T+ph)}" y2="${f(T+ph)}"/>`;
  kept.forEach(d=>{ s+=`<line class="flow-axis" x1="${f(X(d))}" x2="${f(X(d))}" y1="${f(T+ph)}" y2="${f(T+ph+4)}"/><text class="flow-date" x="${f(X(d))}" y="${H-6}" text-anchor="middle">${flowShort(d)}</text>`; });
  s+=`<path class="flow-band" d="${band}"/><path class="flow-opened" d="${step("o")}"/><path class="flow-landed" d="${step("l")}"/>`;
  const yo=Y(M.opened)+4, yl=Math.max(Y(M.landed)+4,yo+14);
  s+=`<text class="flow-end" x="${f(xe+6)}" y="${f(yo)}">opened ${M.opened}</text><text class="flow-end" x="${f(xe+6)}" y="${f(yl)}">landed ${M.landed}</text>${o.small?"":`<text class="flow-open" x="${f(xe+6)}" y="${f(yl+14)}">open ${M.opened-M.landed}</text>`}`;
  const cw=Math.max(8,Math.min(24,pxd));
  M.days.forEach(x=>{ const lab=flowPointWords(x);
    s+=`<g class="flow-point" role="button" tabindex="0" aria-pressed="false" data-sel-key="${flowEsc(o.key(x.d))}" data-flow-keys="${flowEsc(flowIssueKeys(x,o))}" aria-label="${flowEsc(lab)}"><rect class="flow-hit" x="${f(X(x.d)-cw/2)}" y="${T}" width="${f(cw)}" height="${f(ph)}"/>${x.op.length?`<circle class="flow-dot filed" cx="${f(X(x.d))}" cy="${f(Y(x.o))}" r="3.5"/>`:""}${x.ld.length?`<circle class="flow-dot" cx="${f(X(x.d))}" cy="${f(Y(x.l))}" r="4"/>`:""}<title>${flowEsc(lab)}</title></g>`; });
  return s+"</svg>"; }
/* a day's issues as the board's issue keys (o.issueKey(r), issueKey(repo, n)), each once, space-separated: what choosing the day selects */
const flowIssueKeys=(x,o)=>[...new Set([...x.op,...x.ld].map(r=>String(o.issueKey(r))))].join(" ");
/* the day's own key among what was chosen (a key, or the list), for the inspector and its replay */
const flowArgKey=arg=>(Array.isArray(arg)?arg:[arg]).map(k=>String(k==null?"":k)).find(k=>/^flow:/.test(k))||"";
const flowPointWords=x=>`${flowLong(x.d)}: ${[x.op.length?`${x.op.length} filed`:"",x.ld.length?`${x.ld.length} landed`:""].filter(Boolean).join(", ")}; open at the day's end: ${x.o-x.l}`;
/* what the board leaves undrawn, in words: o.what ("issue" or "unit"), o.closedWords */
function flowNotes(M,o){ const w=o.what||"issue";
  return [M.noFiled?`${flowCount(M.noFiled,w)} with no recorded filing date, not drawn`:"",M.noLanded?`${flowCount(M.noLanded,"landing")} with no recorded date, not drawn`:"",M.before?`${flowCount(M.before,"landing")} dated before the ${w}'s filing, not drawn`:"",M.closed?`${flowCount(M.closed,w)} ${o.closedWords}, not drawn`:""].filter(Boolean); }
/* the Legend: the two lines, the band, a point, what is left undrawn, and where the lines stop */
function flowLegend(M,o){ const w=o.what||"issue";
  return `<div class="legend flow-legend"><span><i class="flow-key opened" aria-hidden="true"></i>opened: the ${w}s on this board${w==="unit"?" (issues on this board)":""}, by the day each was filed</span><span><i class="flow-key landed" aria-hidden="true"></i>landed: by the day each landed</span><span><i class="flow-key band" aria-hidden="true"></i>the band between the lines: ${w}s on this board still open</span><span><i class="flow-key point" aria-hidden="true"></i>a point: a day something was filed or landed; select it for that day's ${w}s</span>${flowNotes(M,o).map(t=>`<span>${flowEsc(t)}</span>`).join("")}<span>no projection: the lines stop at the board's date, ${flowLong(flowEnd(M,o))}</span></div>`; }
/* the Disclosure: every point as a list, each day a Button selecting it, its issues linked */
function flowList(M,o){
  return `<details class="flow-list"><summary>Every point as a list (${flowCount(M.days.length,"day")})</summary><table><tbody>${M.days.map(x=>`<tr><td><button type="button" aria-pressed="false" data-sel-key="${flowEsc(o.key(x.d))}" data-flow-keys="${flowEsc(flowIssueKeys(x,o))}">${flowLong(x.d)}</button></td><td>${[x.op.length?`filed ${x.op.map(r=>o.link(r)).join(" ")}`:"",x.ld.length?`landed ${x.ld.map(r=>o.link(r)).join(" ")}`:""].filter(Boolean).join(" · ")}</td><td class="flow-n">open ${x.o-x.l}</td></tr>`).join("")}</tbody></table></details>`; }
/* the whole figure: the lede, the SVG in its frame, the Legend, the Disclosure; o.none, the line when nothing can be drawn */
function flowFigure(M,o){
  if(!M.rows.length){ const n=flowNotes(M,o); return `<p class="lede flow-none">${flowEsc(o.none)}${n.length?" "+flowEsc(n.join("; "))+".":""}</p>`; }
  return `${o.lede?`<p class="lede">${flowEsc(o.lede)}</p>`:""}<div class="flow-frame">${flowSvg(M,o)}</div>${flowLegend(M,o)}${flowList(M,o)}`; }
/* the inspector's entry for one day: o.pair(r), an issue's number and its title, each its link */
function flowDayEntry(M,d,o){ const x=M.days.find(y=>y.d===d); if(!x) return "";
  const li=rs=>`<ul class="flow-issues">${rs.map(r=>`<li>${o.pair(r)}</li>`).join("")}</ul>`;
  return `<div class="kicker">${flowEsc(o.kicker)}</div><div class="name">${flowLong(x.d)}</div><p class="lead">${flowEsc([x.op.length?`${x.op.length} filed`:"",x.ld.length?`${x.ld.length} landed`:""].filter(Boolean).join(" · "))}; open on this board at the day's end: <b>${x.o-x.l}</b> of ${x.o} filed by then.</p><dl>${x.op.length?`<dt>Filed that day</dt><dd>${li(x.op)}</dd>`:""}${x.ld.length?`<dt>Landed that day</dt><dd>${li(x.ld)}</dd>`:""}</dl>`; }
/* a point or a listed day chosen, by click, Enter or Space: the board's one selection, the day's own key first (its mark on this figure),
   then its issues' keys (their marks in every other display), the list into the inspector */
function flowWire(el,id){ if(!el||el.__flowWired) return; el.__flowWired=true;
  const go=t=>{ const p=t&&t.closest&&t.closest("[data-sel-key]"); if(!p||!el.contains(p)||!/^flow:/.test(p.getAttribute("data-sel-key"))) return false;
    selectKey([p.getAttribute("data-sel-key"),...String(p.getAttribute("data-flow-keys")||"").split(" ").filter(Boolean)],id); return true; };
  el.addEventListener("click",e=>{ go(e.target); });
  el.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ")&&e.target&&e.target.tagName!=="BUTTON"&&go(e.target)) e.preventDefault(); }); }
/* the cumulative flow's shared block ends here; what follows is this board's own */
/* The org work board's cumulative flows: one small figure in each repository Panel with work-board data (the hook repo-panel, under its head),
   each on its own count scale, every Panel on one date axis, from the first filing on any of them to the board's date. The board has no live
   redraw of its own: render() draws the Panels again and with them the figures (drawDisplays(true)). */
const FLOW_ID="flow", FLOW_CLOSED=["abandoned","not-planned","duplicate"];
const flowItems=r=>(((r&&r.board)||{}).rows||[]).filter(x=>x&&x.issue!=null).map(x=>{ const st=stOf(x); return {issue:x.issue,title:x.title,created:x.created,landed:x.landed&&x.landed.date,isLanded:st==="landed",closed:FLOW_CLOSED.includes(st)}; });
const flowDate=()=>B.generated||null;
/* the date axis every Panel shares */
const flowShared=()=>{ const ms=ALL_REPOS.filter(r=>r&&r.board).map(r=>flowModel(flowItems(r),flowDate())).filter(M=>M.rows.length); return ms.length?{start:ms.map(M=>M.start).sort()[0],end:ms.map(M=>M.end).sort()[ms.length-1]}:null; };
/* an issue's links read inside its repository's Panel (CUR entered, then put back) */
const flowIn=(r,f)=>{ const was=CUR; enter(r); try{ return f(); } finally{ enter(was); } };
const flowOpts=r=>({what:"issue",closedWords:"closed without landing (cancelled, not planned or a duplicate)",none:"No issue on this repository's work board has a recorded filing date: there is nothing to draw yet.",
  kicker:`${r.name} · issues on its work board · one day`,key:d=>`flow:${repoKey(r)}:${d}`,issueKey:x=>issueKey(repoKey(r),x.issue),link:x=>flowIn(r,()=>ilink(x.issue,repoKey(r))),pair:x=>flowIn(r,()=>pair(x.issue,x.title,repoKey(r)))});
const flowHosts=()=>[...document.querySelectorAll("#repos [data-flow-repo]")];
addHook("repo-panel",r=>((((r&&r.board)||{}).rows)||[]).length?`<div class="flow-figure flow-small" data-flow-repo="${flowEsc(repoKey(r))}"></div>`:"");
addDisplay({id:FLOW_ID,host:()=>flowHosts()[0]||null,
  has(){ return !!flowShared(); },
  draw(){ let sh=null; try{ sh=flowShared(); }catch(e){ displayError(e); } const hosts=flowHosts(), w=Math.min(662,...hosts.map(h=>h.clientWidth||0).filter(n=>n>0));
    hosts.forEach(h=>{ try{ const r=repoOf(h.getAttribute("data-flow-repo")); if(!r||!r.board){ h.innerHTML=""; return; }
      const M=flowModel(flowItems(r),flowDate(),sh&&sh.start), o=Object.assign({w:w-22,small:true,end:sh?sh.end:flowDate(),label:`${r.name}: issues on its work board, opened ${M.opened}, landed ${M.landed}`,
        lede:`Issues on this repository's work board, filed and landed: opened ${M.opened}, landed ${M.landed}, open ${M.opened-M.landed}; every Panel shares the dates.`},flowOpts(r));
      h.innerHTML=flowFigure(M,o); flowWire(h,FLOW_ID); }catch(e){ displayError(e); try{ h.innerHTML=drawFailed(e); }catch(x){} } }); },
  inspect(arg){ const m=/^flow:([^:\s]+\/[^:\s]+):(\d{4}-\d{2}-\d{2})$/.exec(flowArgKey(arg)); const r=m&&repoOf(m[1]); if(!r||!r.board) return ""; const sh=flowShared();
    return flowDayEntry(flowModel(flowItems(r),flowDate(),sh&&sh.start),m[2],flowOpts(r)); },
  idle:"<p>Select a day's point in a repository's figure of issues filed and landed: that day's issues open here.</p>",
  model:k=>{ const r=repoOf(k), sh=flowShared(); return r?flowModel(flowItems(r),flowDate(),sh&&sh.start):null; }});
})();
/* slot s47 end */
/* slot s48 begin */
/* slot s48 end */
/* slot s49 begin */
/* slot s49 end */
/* slot s50 begin */
/* slot s50 end */
addDisplayPlaces();
const tabs=[...document.querySelectorAll(".tab")];
function show(id){ tabs.forEach(t=>{ const on=t.id===id; t.setAttribute("aria-selected",String(on)); t.tabIndex=on?0:-1; document.getElementById(t.getAttribute("aria-controls")).hidden=!on; }); try{ drawDisplays(); }catch(e){} }
tabs.forEach((t,i)=>{ t.addEventListener("click",()=>show(t.id)); });
/* The tablist's keys (WAI-ARIA tabs; GUIDANCE.md §6): Left and Right move to the previous and next tab, Home and End to the first and the
   last, each shown at once; only the selected tab is in the Tab order (a roving tabindex), so Tab moves on to the panel. */
function tabKeys(list,go){ list.forEach((t,i)=>{ t.tabIndex=t.getAttribute("aria-selected")==="true"?0:-1; t.addEventListener("keydown",e=>{ const n=list.length, j={ArrowRight:(i+1)%n,ArrowLeft:(i+n-1)%n,Home:0,End:n-1}[e.key]; if(j==null) return; e.preventDefault(); list[j].focus(); go(list[j].id); }); }); }
tabKeys(tabs,id=>show(id));
/* ---------- The sibling checkouts, read (GUIDANCE.md §6; plan/RULES.md, the org work board) ----------
   Opened from disk, the board loads each repository's work-board data from its checkout (its live view's board.js, else its committed board.js: a
   script, as a page opened from disk cannot fetch a file). A checkout is read when the script ran and named the expected repository; that repository's links
   then open the live files. In the live view (board.json "live") it is re-read every LIVE_POLL_MS and each Panel redraws in place when its data changed; the
   committed snapshot reads it once, for the links only, and shows the snapshot's own data. Never on a website, which has no checkouts. The indicator reads as on the
   repository work board: "LIVE · updated n s ago" while a run is active (the dot pulses), "LIVE · no change for n min" after a quiet spell, "LIVE · data unavailable" when no checkout could be read. */
const LIVE_POLL_MS=5000, LIVE_QUIET_MS=5*60000;
const LIVE={ok:true,last:0,timer:null,tick:null,liveHref:""};
const isLive=()=>!!B.live&&LOCAL;
const ago=ms=>{ const s=Math.max(0,Math.round(ms/1000)); return s<90?`${s} s`:s<5400?`${Math.round(s/60)} min`:`${Math.round(s/3600)} h`; };
function liveChip(){ const c=$("#live"); if(!c) return;
  if(!isLive()){ c.className="livechip off"; c.innerHTML=`<span class="ld" aria-hidden="true"></span>${B.live?"not live":"not live · snapshot"}${B.generated?` ${when(B.generated)}`:""}${LIVE.liveHref?` · <a href="${esc(LIVE.liveHref)}">live view</a>`:""}`; c.title=B.live?"A published copy of the live view: it does not follow the runs.":"The committed org work board, regenerated at every landing in a repository on the board: on a machine with the checkouts, its live view follows them."; return; }
  if(!LIVE.ok){ c.className="livechip on na"; c.innerHTML=`<span class="ld" aria-hidden="true"></span>LIVE · data unavailable`; c.title="No sibling checkout's work-board data could be read."; return; }
  const since=Date.now()-LIVE.last, quiet=since>LIVE_QUIET_MS, any=ALL_REPOS.some(r=>(r.board&&(r.board.rows||[]).some(x=>x.active)));
  c.className=`livechip on${quiet||!any?"":" fillpulse"}`;
  c.innerHTML=quiet?`<span class="ld" aria-hidden="true"></span>LIVE · no change for ${ago(since)}`:`<span class="ld" aria-hidden="true">●</span>LIVE · updated ${ago(since)} ago`;
  c.title=`Re-read from the sibling checkouts every ${LIVE_POLL_MS/1000} s${any?"":"; no run is active"}.`; }
const liveRepos=()=>ALL_REPOS.filter(r=>r.source&&r.source.file);
let READING=null;
window.dashboardLive=(id,data)=>{ if(id==="board"&&READING&&data&&data.repo===repoKey(READING.r)) READING.got=data; };
/* a name kept out of the snapshot (a private repository's, elided from a title or a unit's name, org-board.js) stays out of what the live view draws from a checkout: its text as generated, wherever that is the shorter */
function keepElided(d,e){ const titleOf=(list,x)=>(list||[]).find(y=>y&&y.issue===x.issue); const keep=(obj,key,from)=>{ if(obj&&from&&typeof from[key]==="string"&&from[key].includes("…")&&obj[key]!==from[key]) obj[key]=from[key]; };
  (d.rows||[]).forEach(x=>{ const m=titleOf(e.rows,x); keep(x,"title",m); ((x.chain||{}).units||[]).forEach((u,j)=>keep(u,"name",m&&(((m.chain||{}).units||[])[j]||null))); });
  (d.roadmap||[]).forEach(x=>{ const m=titleOf(e.roadmap,x); keep(x,"title",m); (x.items||[]).forEach(u=>keep(u,"title",titleOf(m&&m.items,u))); }); (d.unscheduled||[]).forEach(x=>keep(x,"title",titleOf(e.unscheduled,x))); }
function applyData(r,data){ if(r.board) keepElided(data,r.board); r.board=data; r.source=Object.assign({},r.source,{generated:data.generated||null,asOf:data.asOf||null}); }
function readSiblings(){ if(!LOCAL) return; let changed=false, any=false; const list=liveRepos().slice();
  const next=()=>{ const r=list.shift(); if(!r){ if(isLive()){ LIVE.ok=any; if(changed) LIVE.last=Date.now(); liveChip(); } if(changed){ const y=window.scrollY,x=window.scrollX; render(); window.scrollTo(x,y); } return; }
    const dir=r.source.file.replace(/\/[^/]*$/,""), sc=document.createElement("script"); READING={r,got:null}; sc.src=`${SIB}${r.name}/${dir}/board.js?t=${Date.now()}`;
    const done=()=>{ const got=READING&&READING.got; sc.remove(); READING=null; if(got){ any=true; const j=JSON.stringify(got), k=repoKey(r), prev=LIVE_DATA.get(k); if(!prev||prev.json!==j){ LIVE_DATA.set(k,{data:got,dir,json:j}); changed=true; if(B.live) applyData(r,got); } } next(); };
    sc.onload=done; sc.onerror=done; document.head.appendChild(sc); };
  next(); }
function startLive(){ const g=Date.parse(String(B.generated||"")); LIVE.last=isNaN(g)?Date.now():Math.min(Date.now(),g); liveChip();
  if(LIVE.tick==null) LIVE.tick=setInterval(liveChip,1000);
  if(isLive()&&!LIVE.timer) LIVE.timer=setInterval(readSiblings,LIVE_POLL_MS); }
function liveMark(src,key,cb){ if(!LOCAL){ cb(null); return; } const sc=document.createElement("script"); sc.src=src+"?t="+Date.now();
  sc.onload=()=>{ const v=(window.DASHBOARDS_LIVE||{})[key]; sc.remove(); cb(v==null?null:v); }; sc.onerror=()=>{ sc.remove(); cb(null); }; document.head.appendChild(sc); }
render(); show(location.hash==="#source"?"t-source":"t-repos");
startLive(); readSiblings();
/* the committed board names the live view on this machine (docs/plans/.live/org-work-board/index.js, written with it) */
if(!B.live) liveMark("../.live/org-work-board/index.js","orgBoard",h=>{ if(h){ LIVE.liveHref="../.live/org-work-board/"+String(h); liveChip(); } });
</script>
