<title>Org work board</title>
<script>/* the theme switch's choice (GUIDANCE.md §1, Themes), applied before the first paint; none chosen: the system setting */try{var t=localStorage.getItem("dashboards-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
/* The org work board (plan/RULES.md, the org work board; shared rules: GUIDANCE.md; based on plan/template/board.html, the repository work board, and its
   rules, plan/RULES.md §5). Every run in every repository of the organization at once: one repository Panel per repository, holding that
   repository's runs as its own repository work board draws them (one row per issue that has an issue board or is sized for a run on the tracker, grouped
   by tracking issue in landing order, then the rest by age, each tracking issue's units as a StepBar under its row) and its own Legend,
   then an organization Panel per sub-organization with its repository Panels inside; the parent organization has no container of its own.
   A template plus its data: board.json embedded verbatim below (plan/scripts/org-board.js). The committed board is a snapshot, regenerated at every landing in a repository on the board, read
   from each repository's work-board data (its live view where one exists, else its committed board.json); the live view on this machine (docs/plans/.live/org-work-board/)
   re-reads each sibling checkout's live data as it changes, so it never needs regenerating to follow a run. Never hand-edit a board.
   Colour plan as on every board: --sys-1..12 are the registry slots. On this board they are each repository's own slots, so a colour is read
   within its repository Panel, whose Legend names the systems it drew; status colours only beside a glyph and a word; the accent marks the
   runs being worked on now (a FullPulse: an accent Ring and an interior that breathe) and the next unit up (a still outer Ring and an UP NEXT
   tag); dashed = not started or no board yet. A row with no board takes its state from the tracker (plan/RULES.md §5, "Boardless rows").
   Links depend on where the board is opened (the links block in the script): opened from disk, a link opens the live file in the sibling
   checkout; on the website, the website's form of a link (one function, siteUrl()). */
:root{
  --bg:#f3f5f8; --surface:#fcfcfd; --surface-2:#eef1f6; --ink:#0e1420; --ink-2:#4a5468; --muted:#7d879a;
  --line:#dfe4ec; --hair:rgba(14,20,32,.10);
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --accent:#6d47e0; --on:#0e1420; --focus:#2a78d6; --link:#2a78d6;
  --sys-1:#2a78d6;--sys-2:#653184;--sys-3:#0d7680;--sys-4:#1d2660;--sys-5:#9656aa;--sys-6:#1a9ec7;--sys-7:#203d4b;--sys-8:#7700c7;--sys-9:#008a81;--sys-10:#7780f8;--sys-11:#271ea9;--sys-12:#09534e;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141b;--surface:#171c25;--surface-2:#1f2530;--ink:#eef1f6;--ink-2:#b8c0ce;--muted:#8a93a5;--line:#2a313d;--hair:rgba(255,255,255,.10);--accent:#a58bff;--on:#eef1f6;--focus:#3987e5;--link:#6aa6f0;--sys-1:#3987e5;--sys-2:#8a44d8;--sys-3:#1f8089;--sys-4:#b4bef5;--sys-5:#a86fb8;--sys-6:#31b5f4;--sys-7:#9ae2f4;--sys-8:#c790d0;--sys-9:#11978e;--sys-10:#245eff;--sys-11:#8365bd;--sys-12:#00c7ba;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10141b;--surface:#171c25;--surface-2:#1f2530;--ink:#eef1f6;--ink-2:#b8c0ce;--muted:#8a93a5;--line:#2a313d;--hair:rgba(255,255,255,.10);--accent:#a58bff;--on:#eef1f6;--focus:#3987e5;--link:#6aa6f0;--sys-1:#3987e5;--sys-2:#8a44d8;--sys-3:#1f8089;--sys-4:#b4bef5;--sys-5:#a86fb8;--sys-6:#31b5f4;--sys-7:#9ae2f4;--sys-8:#c790d0;--sys-9:#11978e;--sys-10:#245eff;--sys-11:#8365bd;--sys-12:#00c7ba;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:1280px;margin:0 auto}
/* wide desktop (16:9 screens): the board uses most of the window, as the issue boards do (GUIDANCE.md §6) */
@media (min-width:1500px){.page{max-width:min(2400px,100%)}}
a{color:inherit}
code{font-family:var(--mono);font-size:.92em;overflow-wrap:anywhere;background:var(--surface-2);border:1px solid var(--hair);padding:1px 4px;border-radius:3px}
/* the code label (GUIDANCE.md §12, "Code"; dashboards-skill/42): every inline code drawn as a label of its own,
   in both themes, at normal weight inside bold text; inside a chip, a pill or a tile (a label or a figure already: each class carries
   its type word) it stays plain mono text */
:is(b,strong,.name,.nm,dt,th) code{font-weight:400}
:is([class*="chip"],[class*="pill"],[class*="tile"]) code{background:none;border:0;padding:0;border-radius:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.crumbs{font-size:12px;color:var(--muted);padding-top:18px}
.crumbs a{text-decoration:none}
/* The header's tools, right of the breadcrumb: the live indicator (the committed board reads "not live · snapshot", the live view follows the
   checkouts) and the theme switch (GUIDANCE.md §1, Themes). The live dot is ink, never a status or accent colour. */
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding-top:18px}
.topbar .crumbs{padding-top:0;min-width:0}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:auto}
.livechip{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--mono);letter-spacing:.03em;padding:5px 9px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink-2);white-space:nowrap}
.livechip:empty{display:none}
.livechip .ld{width:8px;height:8px;border-radius:50%;background:var(--ink);flex:none}
.livechip.on{color:var(--ink);border-color:var(--ink-2)}
.livechip.on.fillpulse .ld{animation:livepulse 1.6s ease-in-out infinite}
.livechip.off .ld{background:none;border:1.5px solid var(--muted)}
.livechip.na .ld{background:var(--muted)}
.livechip a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
@keyframes livepulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.livechip .ld{animation:none!important}}
/* The header's switches (GUIDANCE.md §12, "Switch"): a track with a knob that slides to the side of the state shown, a real toggle
   (role="switch", aria-checked) in the boards' neutrals, never the accent or a status colour. The theme switch's ends are ☀ light and
   ☾ night, its knob at the palette shown. The knob slides in a short transition, and jumps under reduced motion. */
.switch{appearance:none;display:inline-flex;align-items:center;gap:5px;font:600 11px/1 var(--mono);padding:3px 7px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink-2);cursor:pointer;white-space:nowrap}
.switch:hover{color:var(--ink);border-color:var(--ink-2)}
.switch-track{position:relative;flex:none;width:28px;height:16px;border:1px solid var(--ink-2);border-radius:8px;background:var(--surface-2);transition:background-color .18s ease}
.switch-knob{position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--ink-2);transition:transform .18s ease}
.switch[aria-checked="true"] .switch-track{background:color-mix(in srgb,var(--ink-2) 35%,var(--surface))}
.switch[aria-checked="true"] .switch-knob{transform:translateX(12px);background:var(--ink)}
.switch-end{font-size:12px;color:var(--muted)}
.switch[aria-checked="false"] .switch-end.off,.switch[aria-checked="true"] .switch-end.on{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.switch-track,.switch-knob{transition:none}}
h1{font-size:28px;margin:4px 0 2px;letter-spacing:-.01em;font-family:var(--mono)}
.function{color:var(--ink-2);margin:0 0 10px;max-width:78ch;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.chip{font:12px/1 var(--mono);padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink-2);max-width:100%;overflow-wrap:anywhere}
.chip b{color:var(--ink);font-weight:600}
/* The header's two halves (GUIDANCE.md §6, "The header"): from 940 px the intro (the title, the function) fills the left half and the
   tags stand in the right half beside it, each a small card with its label over its value, growing to fill its line, a long one across
   the half (.wide); under 940 px the two stack and the tags wrap as chips, the label before the value. The topbar (the breadcrumb, the
   live indicator, the theme switch) runs across the top. The same rules on every dashboard type. */
.chip .ck{font:700 10px/1.2 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
@media (min-width:940px){
  header{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto auto 1fr;column-gap:28px}
  header>.topbar{grid-column:1/-1;grid-row:1}
  header>h1{grid-column:1;grid-row:2}
  header>.function{grid-column:1;grid-row:3;max-width:none}
  header>.chips{grid-column:2;grid-row:2/-1;align-self:start;align-content:flex-start;gap:8px;margin:8px 0 6px}
  header>.chips>.chip{display:block;flex:1 1 190px;padding:7px 10px 8px;font-size:12.5px;line-height:1.4;border-radius:6px}
  header>.chips>.chip .ck{display:block;margin:0 0 2px}
  header>.chips>.chip.wide{flex-basis:100%}
}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0 18px}
.kpi-tile{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0}
.kpi-tile .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.kpi-tile .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi-tile .s{font-size:12px;color:var(--ink-2);margin-top:2px}
/* A tile that counts states carries a segmented bar of them, its legend inside the tile (GUIDANCE.md §2, "Figures"): the Runs and the Landed
   tiles. A tile that counts one state (active, waiting, up next, not started) has nothing to segment and carries none. */
.kpi-tile .seg-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px;margin-top:8px;background:var(--surface-2)}
.kpi-tile .seg-bar i{display:block;height:100%;background:var(--ink-2)}
.seg-bar i.good{background:var(--good)}.seg-bar i.warning{background:var(--warning)}.seg-bar i.serious{background:var(--serious)}.seg-bar i.critical{background:var(--critical)}.seg-bar i.neutral{background:var(--muted)}.seg-bar i.accent{background:var(--accent)}
.seg-bar i.hollow{background:none!important;border:1.5px solid var(--good)}
.seg-bar i.pln{background:none!important;border:1.5px dashed var(--muted)}
.kpi-tile .legend{margin-top:6px;gap:4px 10px;font-size:11px}
.legend i.segk{width:14px;height:6px;border:0;border-radius:2px;background:var(--sc,var(--ink-2))}
.legend i.segk.good{--sc:var(--good)}.legend i.segk.warning{--sc:var(--warning)}.legend i.segk.serious{--sc:var(--serious)}.legend i.segk.critical{--sc:var(--critical)}.legend i.segk.neutral{--sc:var(--muted)}.legend i.segk.accent{--sc:var(--accent)}
.legend i.segk.hollow{background:none;border:1.5px solid var(--good);height:7px}
.legend i.segk.pln{background:none;border:1.5px dashed var(--muted);height:7px}
/* the Context's legend (GUIDANCE.md §2): the encodings its cards draw */
.context>.legend{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 12px;margin-top:10px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto;overflow-y:hidden}
.tab{appearance:none;border:0;background:none;color:var(--ink-2);font:inherit;font-weight:600;padding:10px 14px;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab.model::after{content:" JSON";font:10px var(--mono);color:var(--muted);vertical-align:super}
.view{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;min-width:0}
.view h2{font-size:15px;margin:0 0 4px}
.lede{font-size:13px;color:var(--ink-2);margin:0 0 10px;max-width:90ch}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:10px 0 0;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:16px;height:11px;border-radius:3px;border:1.5px solid var(--ink-2);background:var(--surface);flex:none}
.legend i.sbar{border-color:var(--line);border-left:4px solid var(--c)}
.legend i.pln{border-style:dashed;background:none;border-color:var(--muted)}
.legend i.gl{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface));box-shadow:inset 0 0 4px 1px color-mix(in srgb,var(--accent) 60%,transparent)}
.legend i.nx{border-color:color-mix(in srgb,var(--accent) 70%,transparent);box-shadow:0 0 6px 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.verdict-pill{--sc:var(--muted);display:inline-flex;align-items:center;gap:5px;font:600 10.5px/1.2 var(--mono);padding:2px 6px;border-radius:3px;border:1px solid var(--line);border-left:3px solid var(--sc);background:color-mix(in srgb,var(--sc) 14%,var(--surface));color:var(--ink);white-space:nowrap}
.verdict-pill i,.legend .verdict-pill i{font-style:normal;font-weight:700;display:inline;width:auto;height:auto;border:0;border-radius:0;background:none;box-shadow:none}
/* a tracking issue's chain (plan/RULES.md §3, "The chain's progress"): the summary in its state cell, and its units as a StepBar on a row
   of its own under it, across the table (dashboards-skill/54; a board.json written before the bar's units: the bar from its unit rows) */
.chainsum{font-size:12px;color:var(--ink-2);line-height:1.4;min-width:0;overflow-wrap:anywhere}
.chainsum b{color:var(--ink)}
.chainsum a{text-decoration:none;border-bottom:1px solid var(--line)}
/* The StepBar (nomenclature/ui.md, StepBar; dashboards-skill/54): the steps of a sequence in order, each a chevron with its name inside,
   done, current or to come. An ordered list, the current step aria-current="step", each step's state said in words to a screen reader
   (.sb-st). It stands on a line of its own and wraps inside itself at phone width, never widening the board; a long name wraps inside its
   chevron. Done: solid, the strong neutral with a faint wash; current: solid, in ink and bold; to come: dashed and muted. Each chevron is
   its list item clipped to the shape, its edge (::before) and its fill (::after) layered inside it, so a dashed edge and a mark follow the
   chevron; each nests into the notch of the next. The same rules on every dashboard type that draws one. */
.stepbar{list-style:none;margin:6px 0 2px;padding:0 0 0 7px;display:flex;flex-wrap:wrap;gap:4px 0;min-width:0;max-width:100%}
.stepbar>li{--sb-edge:var(--ink-2);--sb-fill:color-mix(in srgb,var(--ink-2) 14%,var(--surface));--sb-w:1.5px;position:relative;z-index:0;display:flex;align-items:center;min-width:0;max-width:calc(100% + 7px);min-height:26px;margin-left:-7px;padding:4px 15px 4px 19px;font:11.5px/1.25 var(--mono);color:var(--ink);overflow-wrap:anywhere;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%,10px 50%)}
.stepbar>li:first-child{padding-left:11px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%)}
.stepbar>li::before,.stepbar>li::after{content:"";position:absolute;inset:0;z-index:-2;background:var(--sb-edge)}
.stepbar>li::after{z-index:-1;inset:var(--sb-w);background:var(--sb-fill);clip-path:polygon(1px 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,1px 100%,10.5px 50%)}
.stepbar>li:first-child::after{clip-path:polygon(0 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,0 100%)}
.stepbar>li.cur{--sb-edge:var(--ink);--sb-fill:color-mix(in srgb,var(--ink) 7%,var(--surface));--sb-w:2px;font-weight:700}
.stepbar>li.todo{--sb-edge:repeating-linear-gradient(90deg,var(--muted) 0 5px,transparent 5px 9px);--sb-fill:var(--surface);color:var(--muted)}
.stepbar .sb-st{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.legend i.sbk{position:relative;z-index:0;width:22px;height:12px;border:0;border-radius:0;background:none;--sb-edge:var(--ink-2);--sb-fill:color-mix(in srgb,var(--ink-2) 14%,var(--surface));--sb-w:1.5px;clip-path:polygon(0 0,calc(100% - 6px) 0,100% 50%,calc(100% - 6px) 100%,0 100%,6px 50%)}
.legend i.sbk::before,.legend i.sbk::after{content:"";position:absolute;inset:0;z-index:-2;background:var(--sb-edge)}
.legend i.sbk::after{z-index:-1;inset:var(--sb-w);background:var(--sb-fill);clip-path:polygon(1px 0,calc(100% - 5px) 0,100% 50%,calc(100% - 5px) 100%,1px 100%,6.5px 50%)}
.legend i.sbk.cur{--sb-edge:var(--ink);--sb-fill:color-mix(in srgb,var(--ink) 7%,var(--surface));--sb-w:2px}
.legend i.sbk.todo{--sb-edge:repeating-linear-gradient(90deg,var(--muted) 0 3px,transparent 3px 5px);--sb-fill:var(--surface)}
.tbl tr.chainrow>td{border-top:0;padding:0 6px 10px;border-left:4px solid var(--c,var(--muted))}
.tbl tr.chainrow .stepbar{margin:0}
.tbl .stepbar>li{font-size:12px}
.verdict-pill.good{--sc:var(--good)}.verdict-pill.warning{--sc:var(--warning)}.verdict-pill.serious{--sc:var(--serious)}.verdict-pill.critical{--sc:var(--critical)}
.verdict-pill.neutral,.verdict-pill.hollow{background:var(--surface)}
/* Depends on, and Blocks · enables (plan/RULES.md §5; dashboards-skill/30): each issue with a small pill of its state, glyph and word */
.deps{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.dep-item{display:inline-flex;flex-wrap:wrap;align-items:center;gap:2px 5px;min-width:0}
.dep-item .verdict-pill{font-size:9.5px;padding:1px 5px}
/* one pill per dependency, two parts: its build state (a status pill) and its locality (a neutral ramp, faintest near, full ink far) */
.dep-pill{display:inline-flex;align-items:stretch;border-radius:3px;white-space:nowrap}
.dep-pill>.verdict-pill{border-top-right-radius:0;border-bottom-right-radius:0}
.loc{--lc:var(--muted);display:inline-flex;align-items:center;gap:4px;font:600 9.5px/1.2 var(--mono);padding:1px 5px;border:1px solid var(--line);border-left:3px solid var(--lc);border-radius:3px;background:var(--surface);color:var(--ink-2);white-space:nowrap}
.dep-pill>.verdict-pill+.loc{border-left-width:3px;border-top-left-radius:0;border-bottom-left-radius:0;margin-left:-1px}
.loc i{font-style:normal;font-weight:700}
.loc.l1{--lc:color-mix(in srgb,var(--ink) 22%,var(--surface))}.loc.l2{--lc:color-mix(in srgb,var(--ink) 45%,var(--surface))}.loc.l3{--lc:color-mix(in srgb,var(--ink) 70%,var(--surface))}.loc.l4{--lc:var(--ink)}
.legend .loc i,.legend .dep-pill i{display:inline;width:auto;height:auto;border:0;background:none;box-shadow:none}
.verdict-pill.dashed{border-style:dashed;color:var(--ink-2)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--c,var(--muted));flex:none;vertical-align:-1px;margin-right:5px}
/* In progress (GUIDANCE.md §1): a FullPulse (.fullpulse), a solid accent Ring with an interior that breathes, over an accent wash. With
   reduced motion it holds still at its middle strength. Up next: a still outer Ring (.upnext-ring), with the UP NEXT tag beside it. */
@keyframes fullpulse{0%,100%{box-shadow:inset 0 0 0 2px var(--accent),inset 0 0 3px 1px color-mix(in srgb,var(--accent) 35%,transparent)}50%{box-shadow:inset 0 0 0 2px var(--accent),inset 0 0 9px 3px color-mix(in srgb,var(--accent) 65%,transparent)}}
.verdict-pill.fullpulse,.fullpulse{animation:fullpulse 2s ease-in-out infinite;background:color-mix(in srgb,var(--accent) 16%,var(--surface));border-color:var(--accent);border-left-color:var(--sc,var(--accent))}
@media (prefers-reduced-motion:reduce){.verdict-pill.fullpulse,.fullpulse{animation:none!important;box-shadow:inset 0 0 0 2px var(--accent),inset 0 0 6px 2px color-mix(in srgb,var(--accent) 50%,transparent)}}
/* A run that waits on you, halted or escalated, keeps its in-progress mark stopped to the Ring alone (GUIDANCE.md §1): still. */
.verdict-pill.held{box-shadow:inset 0 0 0 2px var(--accent)}
.legend i.hold{border:2px solid var(--accent)}
.upnext-ring{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--accent) 70%,transparent),0 0 9px 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.tag-next{display:inline-block;font:700 9.5px/1 var(--mono);letter-spacing:.08em;padding:3px 5px;border-radius:3px;border:1px solid var(--accent);color:var(--accent);background:var(--surface);white-space:nowrap;vertical-align:1px}
.tags{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin-top:4px}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:900px}

    const dir=r.source.file.replace(/\/[^/]*$/,""), sc=document.createElement("script"); READING={r,got:null}; sc.src=`${SIB}${r.name}/${dir}/board.js?t=${Date.now()}`;
    const done=()=>{ const got=READING&&READING.got; sc.remove(); READING=null; if(got){ any=true; const j=JSON.stringify(got), k=repoKey(r), prev=LIVE_DATA.get(k); if(!prev||prev.json!==j){ LIVE_DATA.set(k,{data:got,dir,json:j}); changed=true; if(B.live) applyData(r,got); } } next(); };
    sc.onload=done; sc.onerror=done; document.head.appendChild(sc); };
  next(); }
function startLive(){ const g=Date.parse(String(B.generated||"")); LIVE.last=isNaN(g)?Date.now():Math.min(Date.now(),g); liveChip();
  if(LIVE.tick==null) LIVE.tick=setInterval(liveChip,1000);
  if(isLive()&&!LIVE.timer) LIVE.timer=setInterval(readSiblings,LIVE_POLL_MS); }
function liveMark(src,key,cb){ if(!LOCAL){ cb(null); return; } const sc=document.createElement("script"); sc.src=src+"?t="+Date.now();
  sc.onload=()=>{ const v=(window.DASHBOARDS_LIVE||{})[key]; sc.remove(); cb(v==null?null:v); }; sc.onerror=()=>{ sc.remove(); cb(null); }; document.head.appendChild(sc); }
render(); show(location.hash==="#source"?"t-source":"t-repos");
startLive(); readSiblings();
/* the committed board names the live view on this machine (docs/plans/.live/org-work-board/index.js, written with it) */
if(!B.live) liveMark("../.live/org-work-board/index.js","orgBoard",h=>{ if(h){ LIVE.liveHref="../.live/org-work-board/"+String(h); liveChip(); } });
</script>
